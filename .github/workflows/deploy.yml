name: Build and Deploy

# Builds both images in Actions, pushes them to GHCR, then SSHes to the VPS and
# pulls. The previous workflow ran `docker compose build` on the server, which
# burned VPS CPU/RAM on every deploy; the other apps on this box already use the
# build-in-CI + pull-on-server pattern, so this matches them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false      # never abort a half-finished deploy

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE:  ghcr.io/rizwansammo/matedesk-backend
  FRONTEND_IMAGE: ghcr.io/rizwansammo/matedesk-frontend

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # this is what authorises the GHCR push — no PAT needed
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push:    true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      # NEXT_PUBLIC_* are inlined into the JS bundle at build time, so the domain
      # has to be baked in here rather than supplied at container start.
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push:    true
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_APP_DOMAIN=matedesk.pro
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to MateServer
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host:            ${{ secrets.VPS_HOST }}
          username:        ${{ secrets.VPS_USER }}
          key:             ${{ secrets.VPS_SSH_KEY }}
          timeout:         30s
          command_timeout: 15m
          envs: GITHUB_SHA
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_PATH }}

            # Pin this deploy to the exact commit that was just built, so a
            # rollback is `MATEDESK_*_IMAGE=...:<old-sha> docker compose up -d`.
            export MATEDESK_BACKEND_IMAGE=ghcr.io/rizwansammo/matedesk-backend:${GITHUB_SHA}
            export MATEDESK_FRONTEND_IMAGE=ghcr.io/rizwansammo/matedesk-frontend:${GITHUB_SHA}

            docker compose pull backend frontend
            docker compose up -d --remove-orphans

            echo "--- waiting for backend health ---"
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 http://127.0.0.1:8005/api/health/ >/dev/null 2>&1; then
                echo "backend healthy after ${i}0s"; break
              fi
              if [ "$i" = "30" ]; then
                echo "backend did not become healthy"; docker compose logs --tail=120 backend; exit 1
              fi
              sleep 10
            done

            docker compose ps
            docker image prune -f --filter "until=168h" || true
