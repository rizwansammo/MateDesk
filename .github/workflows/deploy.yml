name: Build and Deploy

# Builds both images in Actions, pushes them to GHCR, then SSHes to the VPS and
# pulls. The previous workflow ran `docker compose build` on the server, which
# burned VPS CPU/RAM on every deploy; the other apps on this box already use the
# build-in-CI + pull-on-server pattern, so this matches them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false      # never abort a half-finished deploy

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE:  ghcr.io/rizwansammo/matedesk-backend
  FRONTEND_IMAGE: ghcr.io/rizwansammo/matedesk-frontend

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # this is what authorises the GHCR push — no PAT needed
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push:    true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      # NEXT_PUBLIC_* are inlined into the JS bundle at build time, so the domain
      # has to be baked in here rather than supplied at container start.
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push:    true
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_APP_DOMAIN=matedesk.pro
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

  deploy:
    name: Deploy to MateServer
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read          # lets GITHUB_TOKEN pull the images it just pushed
    env:
      GHCR_USER:  ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host:            ${{ secrets.VPS_HOST }}
          username:        ${{ secrets.VPS_USER }}
          key:             ${{ secrets.VPS_SSH_KEY }}
          timeout:         30s
          command_timeout: 15m
          envs: GITHUB_SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_PATH }}

            # GHCR auth for this pull only.
            #
            # The box's shared /root/.docker/config.json is logged in as a
            # DIFFERENT account which has read access to the other apps' packages
            # but not to matedesk-*. Rather than repoint that shared credential
            # (which would risk NetaMate/TalkRoom pulls), authenticate into an
            # isolated DOCKER_CONFIG with the ephemeral GITHUB_TOKEN. Pushing
            # these packages from this repo auto-links them, so this token can
            # read them. The shared config is left untouched.
            export DOCKER_CONFIG=/root/.docker-matedesk
            mkdir -p "$DOCKER_CONFIG"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pin this deploy to the exact commit that was just built, so a
            # rollback is `MATEDESK_*_IMAGE=...:<old-sha> docker compose up -d`.
            export MATEDESK_BACKEND_IMAGE=ghcr.io/rizwansammo/matedesk-backend:${GITHUB_SHA}
            export MATEDESK_FRONTEND_IMAGE=ghcr.io/rizwansammo/matedesk-frontend:${GITHUB_SHA}

            docker compose pull backend frontend
            docker compose up -d --remove-orphans

            # The Host header is required: ALLOWED_HOSTS lists only real public
            # hostnames, so Django answers a bare 127.0.0.1 request with 400
            # DisallowedHost. Sending the real Host also makes this probe exercise
            # the same path nginx will, rather than a special-cased one.
            echo "--- waiting for backend health ---"
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 -H "Host: matedesk.pro" http://127.0.0.1:8005/api/health/ >/dev/null 2>&1; then
                echo "backend healthy after ${i}0s"; break
              fi
              if [ "$i" = "30" ]; then
                echo "backend did not become healthy"; docker compose logs --tail=120 backend; exit 1
              fi
              sleep 10
            done

            docker compose ps

            # Drop the ephemeral credential; the token is dead after this run anyway.
            docker logout ghcr.io || true
            rm -rf "$DOCKER_CONFIG"
            unset DOCKER_CONFIG
            docker image prune -f --filter "until=168h" || true
