name: Build and Deploy

# Builds both images in Actions, pushes them to GHCR, then SSHes to the VPS and
# pulls. The previous workflow ran `docker compose build` on the server, which
# burned VPS CPU/RAM on every deploy; the other apps on this box already use the
# build-in-CI + pull-on-server pattern, so this matches them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Production main deploys never cancel each other. PR validation uses its own
  # ref-scoped group and only keeps the newest head revision.
  group: matedesk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE:                     ghcr.io/rizwansammo/matedesk-backend
  FRONTEND_IMAGE:                    ghcr.io/rizwansammo/matedesk-frontend
  SINGLE_FRONTEND_IMAGE:             ghcr.io/rizwansammo/matedesk-frontend-single-tenant
  NETAMATE_HELPDESK_FRONTEND_IMAGE:  ghcr.io/rizwansammo/matedesk-frontend-netamate-helpdesk

jobs:
  # ── Gates ───────────────────────────────────────────────────────────────────
  # These run before anything is built or shipped, so a failing test or a schema
  # drift blocks the deploy instead of reaching production. The two jobs run in
  # parallel; `build` requires both.

  test-backend:
    name: Backend tests + migration check
    runs-on: ubuntu-latest
    services:
      # Postgres is required, not optional: users/0008_fix_2fa_fields.py uses
      # Postgres-only DDL (ADD COLUMN IF NOT EXISTS), so migrations cannot run on
      # SQLite despite settings.py advertising it as a fallback.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       matedesk_test
          POSTGRES_USER:     matedesk
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U matedesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG:            'True'
      SECRET_KEY:       ci-secret-key-not-used-in-production
      JWT_SECRET_KEY:   ci-jwt-secret-key-not-used-in-production
      DATABASE_URL:     postgresql://matedesk:ci-postgres-password@localhost:5432/matedesk_test
      ALLOWED_HOSTS:    localhost,127.0.0.1,.localhost
      NON_TENANT_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'      # Django 5.2 does not support 3.14
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Check for missing migrations
        working-directory: backend
        # Catches a model changed without a matching migration — this found real
        # drift on users.role during the split.
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity=2

  test-frontend:
    name: Frontend typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        # Faster than waiting for the Docker build to type-check, and fails earlier.
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        # No --max-warnings: the config deliberately keeps a backlog of ~76
        # warnings (mostly `any` and unused vars) visible without blocking a
        # release. Errors are zero and must stay that way.
        run: npx eslint .

  # ── Build ───────────────────────────────────────────────────────────────────
  build:
    name: Build and push images
    if: github.event_name != 'pull_request'
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # this is what authorises the GHCR push — no PAT needed
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push:    true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max

      # NEXT_PUBLIC_* are inlined into the JS bundle at build time, so the domain
      # has to be baked in here rather than supplied at container start.
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push:    true
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_APP_DOMAIN=matedesk.pro
            NEXT_PUBLIC_DEPLOYMENT_MODE=multi_tenant
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max

      # Reusable dedicated-install image. The placeholder domain deliberately
      # keeps production HTTPS behaviour without tying the bundle to a customer
      # hostname; single-tenant routing and auth use the actual request host.
      - name: Build and push single-tenant frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push:    true
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_APP_DOMAIN=dedicated.invalid
            NEXT_PUBLIC_DEPLOYMENT_MODE=single_tenant
            NEXT_PUBLIC_PRODUCT_NAME=HelpDesk
            NEXT_PUBLIC_PRODUCT_WORDMARK=Support
          tags: |
            ${{ env.SINGLE_FRONTEND_IMAGE }}:latest
            ${{ env.SINGLE_FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend-single-tenant
          cache-to:   type=gha,scope=frontend-single-tenant,mode=max

      - name: Build and push NetaMate HelpDesk frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push:    true
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_APP_DOMAIN=helpdesk.netamate.com
            NEXT_PUBLIC_DEPLOYMENT_MODE=single_tenant
            NEXT_PUBLIC_PRODUCT_NAME=NetaMate HelpDesk
            NEXT_PUBLIC_PRODUCT_WORDMARK=NetaMate
            NEXT_PUBLIC_PRODUCT_LOGO_VARIANT=netamate
          tags: |
            ${{ env.NETAMATE_HELPDESK_FRONTEND_IMAGE }}:latest
            ${{ env.NETAMATE_HELPDESK_FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend-netamate-helpdesk
          cache-to:   type=gha,scope=frontend-netamate-helpdesk,mode=max

  deploy:
    name: Deploy to MateServer
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read          # lets GITHUB_TOKEN pull the images it just pushed
    env:
      GHCR_USER:  ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host:            ${{ secrets.VPS_HOST }}
          username:        ${{ secrets.VPS_USER }}
          key:             ${{ secrets.VPS_SSH_KEY }}
          timeout:         30s
          command_timeout: 15m
          envs: GITHUB_SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ${{ secrets.VPS_PATH }}

            # GHCR auth for this pull only.
            #
            # The box's shared /root/.docker/config.json is logged in as a
            # DIFFERENT account which has read access to the other apps' packages
            # but not to matedesk-*. Rather than repoint that shared credential
            # (which would risk NetaMate/TalkRoom pulls), authenticate into an
            # isolated DOCKER_CONFIG with the ephemeral GITHUB_TOKEN. Pushing
            # these packages from this repo auto-links them, so this token can
            # read them. The shared config is left untouched.
            export DOCKER_CONFIG=/root/.docker-matedesk
            mkdir -p "$DOCKER_CONFIG"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pin this deploy to the exact commit that was just built, so a
            # rollback is `MATEDESK_*_IMAGE=...:<old-sha> docker compose up -d`.
            export MATEDESK_BACKEND_IMAGE=ghcr.io/rizwansammo/matedesk-backend:${GITHUB_SHA}
            export MATEDESK_FRONTEND_IMAGE=ghcr.io/rizwansammo/matedesk-frontend:${GITHUB_SHA}

            docker compose pull backend frontend
            docker compose up -d --remove-orphans

            # The Host header is required: ALLOWED_HOSTS lists only real public
            # hostnames, so Django answers a bare 127.0.0.1 request with 400
            # DisallowedHost. Sending the real Host also makes this probe exercise
            # the same path nginx will, rather than a special-cased one.
            echo "--- waiting for backend health ---"
            for i in $(seq 1 30); do
              if curl -fsS --max-time 5 -H "Host: matedesk.pro" http://127.0.0.1:8005/api/health/ >/dev/null 2>&1; then
                echo "backend healthy after ${i}0s"; break
              fi
              if [ "$i" = "30" ]; then
                echo "backend did not become healthy"; docker compose logs --tail=120 backend; exit 1
              fi
              sleep 10
            done

            docker compose ps

            # Drop the ephemeral credential; the token is dead after this run anyway.
            docker logout ghcr.io || true
            rm -rf "$DOCKER_CONFIG"
            unset DOCKER_CONFIG
            docker image prune -f --filter "until=168h" || true
