# MateDesk — Nginx configuration
# Place at: /etc/nginx/sites-available/matedesk.conf
# Enable: ln -s /etc/nginx/sites-available/matedesk.conf /etc/nginx/sites-enabled/
# Test:   nginx -t
# Reload: systemctl reload nginx

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen      80;
    server_name matedesk.pro app.matedesk.pro *.matedesk.pro;
    return 301  https://$host$request_uri;
}

# ── www → apex redirect ───────────────────────────────────────────────────────
server {
    listen      443 ssl http2;
    server_name www.matedesk.pro;

    ssl_certificate     /etc/letsencrypt/live/matedesk.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matedesk.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://matedesk.pro$request_uri;
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen      443 ssl http2;
    server_name matedesk.pro app.matedesk.pro *.matedesk.pro;

    # SSL — issued by Certbot with DNS wildcard challenge
    ssl_certificate     /etc/letsencrypt/live/matedesk.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matedesk.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection          "1; mode=block"                                always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    client_max_body_size 25M;

    # ── Django REST API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass            http://127.0.0.1:8005;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }

    # ── Platform Admin (custom Django admin portal) ───────────────────────────
    location = /platform-admin {
        return 301 /platform-admin/;
    }
    location /platform-admin/ {
        proxy_pass            http://127.0.0.1:8005;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /admin → 301 redirect to platform-admin (handled by nginx to avoid
    # hitting Next.js which would intercept it first)
    location = /admin {
        return 301 /platform-admin/login/;
    }
    location /admin/ {
        return 301 /platform-admin/login/;
    }

    # ── Hidden Django built-in admin (emergency access only) ─────────────────
    location /django-admin/ {
        proxy_pass            http://127.0.0.1:8005;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static files (served by WhiteNoise via Gunicorn) ─────────────────────
    location /static/ {
        proxy_pass http://127.0.0.1:8005;
        expires    1y;
        add_header Cache-Control "public, immutable";
        # nginx only inherits add_header from the parent level when the current
        # level declares NONE. Because Cache-Control is set here, every
        # server-level security header would otherwise be dropped for /static/
        # (the `always` flag does not change inheritance). Repeat them.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-XSS-Protection          "1; mode=block"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
    }

    # ── Media uploads ─────────────────────────────────────────────────────────
    location /media/ {
        proxy_pass http://127.0.0.1:8005;
    }

    # ── WebSocket — live chat + notifications ─────────────────────────────────
    # Handles /ws/chat/, /ws/notifications/
    location /ws/ {
        proxy_pass          http://127.0.0.1:8005;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── Next.js frontend ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
